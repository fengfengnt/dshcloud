name: Sync dev to GitLab

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push dev to GitLab
        env:
          GITLAB_SYNC_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: git push "http://oauth2:${GITLAB_SYNC_TOKEN}@8.133.188.56:9091/fengfeng/dshcloud.git" HEAD:dev
